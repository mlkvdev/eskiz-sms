[project]
name = "eskiz-sms"
version = "1.0.0"
description = "Modern Python SDK for the Eskiz.uz SMS gateway"
readme = "README.md"
license = { file = "License" }
authors = [
    { name = "Malikov", email = "mlkv.dev@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["eskiz", "sms", "uzbekistan", "sms-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/mlkvdev/eskiz-sms"
Repository = "https://github.com/mlkvdev/eskiz-sms"
Issues = "https://github.com/mlkvdev/eskiz-sms/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "ty",
    "basedpyright>=1.13",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eskiz"]

[tool.hatch.build.targets.sdist]
include = [
    "/eskiz",
    "/README.md",
    "/CHANGELOG.md",
    "/License",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
include = ["eskiz", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportMissingTypeStubs = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["eskiz", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: hits the real Eskiz API; opt-in via --run-integration",
]
